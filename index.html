<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>BLOXFORGE — Création de jeux Roblox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Archivo:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" integrity="sha384-uTYyvsSSUZeaPhb5RbKlQa0zY/WpX/QHfvg2mczXyBQOpkWPEDy9lczyp+w7SKXu" crossorigin="anonymous" defer></script>
  <script src="./auth-client.js" defer></script>
  <script src="./script.js" defer></script>
</head>
<body class="auth-locked">
<header>
  <div class="hd-in">
    <button class="logo" id="homeLink" type="button" aria-label="BLOXFORGE — accueil">Blox<span>forge</span></button>
    <div class="hd-right">
      <span class="save-ind" id="saveInd"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="hard-drive-download" aria-hidden="true" class="lucide lucide-hard-drive-download"><path d="M12 2v8"></path><path d="m16 6-4 4-4-4"></path><rect width="20" height="8" x="2" y="14" rx="2"></rect><path d="M6 18h.01"></path><path d="M10 18h.01"></path></svg><span>SAUVEGARDÉ</span></span>
      <div class="xp-pill" id="xpPill"><span id="hdXP">0 XP</span><span class="rk" id="hdRank">NOVICE</span></div>
      <button class="hd-reset" id="resetBtn" title="Réinitialiser la progression"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="rotate-ccw" aria-hidden="true" class="lucide lucide-rotate-ccw"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg></button>
    </div>
  </div>
</header>

<div id="app"></div>

<div id="kubo">
  <div class="kb-bubble" id="kbBubble"><span id="kbMsg">Bienvenue ! Cherche une formation pour commencer à créer.</span></div>
  <button class="kb-av" id="kbAv" title="Kubo — ton compagnon de progression"><div class="kfig"><svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><ellipse cx="60" cy="112" rx="27" ry="4.5" fill="rgba(23,24,28,.07)"></ellipse><g transform="rotate(-38 14 62)"><rect x="7" y="58" width="14" height="24" rx="7" fill="#fff" stroke="#17181C" stroke-width="3"></rect></g><g transform="rotate(38 106 62)"><rect x="99" y="58" width="14" height="24" rx="7" fill="#fff" stroke="#17181C" stroke-width="3"></rect></g><line x1="60" y1="24" x2="60" y2="9" stroke="#17181C" stroke-width="3"></line><circle cx="60" cy="7" r="4.5" fill="#E8930C"></circle><rect x="21" y="24" width="78" height="80" rx="17" fill="#FFFFFF" stroke="#17181C" stroke-width="3.5"></rect><rect x="38" y="102" width="14" height="9" rx="4" fill="#17181C"></rect><rect x="68" y="102" width="14" height="9" rx="4" fill="#17181C"></rect><rect x="33" y="40" width="54" height="44" rx="9" fill="#17181C"></rect><g class="kbl" fill="none" stroke="#9BC9FF" stroke-width="4.5" stroke-linecap="round"><path d="M41 60 Q47.5 51 54 60"></path><path d="M66 60 Q72.5 51 79 60"></path></g><path d="M50 71 Q60 83 70 71 Z" fill="#9BC9FF"></path><circle cx="60" cy="93" r="3" fill="#E8930C" opacity=".85"></circle></svg></div></button>
</div>

<div id="toasts"></div>

<div id="modal">
  <div class="mo-box card"><div class="mo-in">
    <div class="mo-t">Réinitialiser la progression ?</div>
    <div class="mo-p">Tout ton avancement sera effacé : cours, missions, évaluations, XP et rangs. Cette action est définitive.</div>
    <div class="mo-row">
      <button class="ex-reset" id="moCancel">ANNULER</button>
      <button class="btn-r" id="moConfirm"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="trash-2" aria-hidden="true" class="lucide lucide-trash-2"><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path><path d="M3 6h18"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>RÉINITIALISER</button>
    </div>
  </div></div>
</div>
</body>
</html>
