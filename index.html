<!DOCTYPE html>
<html lang="fr">
<head>
<meta name="google-site-verification" content="T6AQhShGeFgFYek7UGoZ_8LiRMZiuNGBZrcB1g0y-QA" /> 
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLOX//FORGE — Apprends à créer ton jeu Roblox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{
  --bg:#FFFFFF; --panel:#FFFFFF; --panel2:#F6F9FF; --soft:#EAF1FD;
  --line:#E3E9F4; --line2:#C9D6EE;
  --ink:#16233F; --muted:#5C6B8A; --body:#333F5C;
  --blue:#1B5BD6; --blue-h:#2A6AE6; --navy:#0E3E9E;
  --red:#D64550; --amber:#B25E09; --green:#0E8A6D;
  --shadow:0 1px 2px rgba(22,35,63,.05),0 6px 20px rgba(22,35,63,.07);
  --fu:'IBM Plex Sans',sans-serif; --fm:'IBM Plex Mono',monospace;
  --acc:var(--blue); --softa:var(--soft);
}
*{margin:0;padding:0;box-sizing:border-box}
::selection{background:var(--soft);color:var(--navy)}
/* overflow-x sur html (jamais sur body) pour préserver le défilement natif */
html{scroll-behavior:smooth;overflow-x:hidden;scroll-padding-top:72px}
body{background:var(--bg);color:var(--body);font-family:var(--fu);font-size:15.5px;line-height:1.75}
::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-track{background:#F2F6FC}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:var(--blue)}
button{font-family:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
svg.lucide{width:17px;height:17px;stroke-width:2}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}

/* ---------- KUBO ---------- */
.kbl{transform-box:fill-box;transform-origin:center;animation:kblink 4.6s infinite}
@keyframes kblink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
.ksp{animation:ksp 1.1s ease-in-out infinite}
@keyframes ksp{50%{opacity:.25;transform:scale(.7)}}
.kubo-hero{animation:kfloat 4.5s ease-in-out infinite}
@keyframes kfloat{50%{transform:translateY(-10px)}}

/* ---------- BOOT ---------- */
#boot{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity .5s}
#boot.done{opacity:0;pointer-events:none}
.boot-in{width:min(460px,88vw)}
#bootKubo{width:104px;height:104px;margin-bottom:12px;transform:scale(0);transition:transform .45s cubic-bezier(.3,1.6,.4,1)}
#bootKubo.on{transform:scale(1)}
.boot-logo{font-weight:600;font-size:24px;letter-spacing:.5px;color:var(--ink)}
.boot-logo span{color:var(--blue)}
.boot-lines{font-family:var(--fm);font-size:12px;color:var(--muted);min-height:112px;margin-top:20px}
.boot-lines div{margin-bottom:7px;opacity:0;animation:bline .25s forwards}
.boot-lines .ok{color:var(--blue)}
@keyframes bline{to{opacity:1}}
.boot-bar{height:3px;background:var(--line);margin-top:20px;border-radius:2px;overflow:hidden}
.boot-bar i{display:block;height:100%;width:0;background:var(--blue);transition:width 1.7s cubic-bezier(.6,.05,.3,1)}
.boot-btn{display:inline-flex;align-items:center;gap:8px;margin-top:18px;background:var(--panel);border:1px solid var(--line2);color:var(--blue);font-family:var(--fm);font-size:11px;letter-spacing:1.5px;padding:11px 18px;border-radius:9px;transition:.2s}
.boot-btn:hover{background:var(--blue);color:#fff;border-color:var(--blue)}

/* ---------- HEADER ---------- */
header{position:fixed;top:0;left:0;right:0;height:60px;z-index:50;display:flex;align-items:center;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd-in{width:min(1180px,100%);margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:24px}
.logo{font-weight:600;font-size:16px;color:var(--ink);cursor:pointer;user-select:none;letter-spacing:.3px}
.logo em{font-style:normal;color:var(--blue)}
.hd-mid{flex:1;display:flex;align-items:center;gap:20px;justify-content:center}
.hd-p{display:flex;align-items:center;gap:8px}
.hd-p span{font-family:var(--fm);font-size:9px;letter-spacing:1.5px;color:var(--muted)}
.segs{display:flex;gap:4px}
.seg{width:20px;height:5px;background:var(--line);border-radius:2px;position:relative;overflow:hidden}
.seg i{position:absolute;inset:0;width:0;background:var(--pc,var(--blue));transition:width .6s}
.hd-right{display:flex;align-items:center;gap:16px}
.xp-box{text-align:right;line-height:1.3}
.xp-val{font-family:var(--fm);font-weight:500;font-size:13px;color:var(--ink)}
.xp-val.pump{transform:scale(1.15);color:var(--blue)}
.xp-rank{font-family:var(--fm);font-size:9px;letter-spacing:2px;color:var(--muted)}
.hd-reset{background:var(--panel);border:1px solid var(--line);color:var(--muted);width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:.2s}
.hd-reset:hover{border-color:var(--red);color:var(--red)}

/* ---------- VUES ---------- */
#app{padding-top:60px}
.view-in{animation:vin .4s ease}
.view-out{animation:vout .18s forwards}
@keyframes vin{from{opacity:0;transform:translateY(16px)}}
@keyframes vout{to{opacity:0;transform:translateY(-10px)}}
.wrap{width:min(1180px,100%);margin:0 auto;padding:0 24px}
.rv{opacity:0;transform:translateY(16px)}
.rv.rv-in{opacity:1;transform:none;transition:opacity .55s,transform .55s ease}
.st-l{font-family:var(--fm);font-size:10px;letter-spacing:2.5px;color:var(--acc);margin-bottom:12px;display:flex;align-items:center;gap:10px}
.st-l::before{content:'';width:26px;height:2px;background:var(--acc);border-radius:1px}

/* ---------- HERO ---------- */
.hero{border-bottom:1px solid var(--line);background:var(--panel2)}
.hero-grid{width:min(1180px,100%);margin:0 auto;padding:72px 24px 64px;display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center}
.kicker{font-family:var(--fm);font-size:11px;letter-spacing:2px;color:var(--blue);margin-bottom:18px}
h1{font-weight:600;font-size:clamp(1.8rem,4vw,3rem);line-height:1.2;letter-spacing:-.5px;color:var(--ink);max-width:16ch}
h1 .acc{color:var(--blue)}
.hero-sub{margin-top:18px;max-width:54ch;color:var(--muted);font-size:16px}
.hero-sub b{color:var(--ink);font-weight:600}
.hero-cta{margin-top:30px;display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;font-weight:500;font-size:14px;padding:12px 24px;border:none;border-radius:9px;transition:.2s}
.btn-p{background:var(--acc);color:#fff}
.btn-p:hover{background:var(--blue-h);transform:translateY(-2px);box-shadow:0 6px 16px rgba(27,91,214,.25)}
.btn-g{background:var(--panel);border:1px solid var(--line2);color:var(--ink)}
.btn-g:hover{border-color:var(--blue);color:var(--blue)}
.hero-stats{margin-top:38px;display:flex;font-family:var(--fm);font-size:10px;letter-spacing:1px;color:var(--muted);flex-wrap:wrap}
.hst{padding:0 22px;border-left:1px solid var(--line2)}
.hst:first-child{padding-left:0;border:none}
.hst b{display:block;font-size:20px;color:var(--ink);font-weight:600;margin-bottom:2px;font-family:var(--fu)}
.hero-kubo{display:flex;flex-direction:column;align-items:center;gap:18px}
.kb-say{position:relative;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:16px 18px;font-size:14px;color:var(--body);max-width:290px;box-shadow:var(--shadow)}
.kb-say::after{content:'';position:absolute;bottom:-7px;left:50%;width:13px;height:13px;background:var(--panel);border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);transform:translateX(-50%) rotate(45deg)}
.kb-say b{color:var(--blue)}
.kfig{width:180px;height:180px}
.kfig svg{width:100%;height:100%}
.kb-name{font-family:var(--fm);font-size:10px;letter-spacing:2px;color:var(--muted)}

/* ---------- STATUS ---------- */
.status{padding:48px 0;border-bottom:1px solid var(--line);background:var(--bg)}
.status-grid{display:grid;grid-template-columns:1.4fr .8fr auto;gap:34px;align-items:center;padding:28px 32px}
.st-title{font-weight:600;font-size:16px;color:var(--ink);margin-bottom:18px}
.pg-row{display:flex;align-items:center;gap:14px;margin-bottom:13px}
.pg-row .lb{font-family:var(--fm);font-size:10px;letter-spacing:1.5px;width:54px;color:var(--ink);font-weight:500}
.pg-track{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.pg-track i{display:block;height:100%;width:0;background:var(--pc);transition:width .7s}
.pg-row .ct{font-family:var(--fm);font-size:11px;color:var(--muted);width:80px;text-align:right}
.st-note{font-family:var(--fm);font-size:11px;color:var(--muted);margin-top:14px}
.st-xp{border-left:1px solid var(--line);padding-left:30px}
.st-xp .v{font-weight:600;font-size:30px;color:var(--ink)}
.st-xp .v small{font-size:13px;color:var(--muted)}
.st-xp .r{font-family:var(--fm);font-size:10px;letter-spacing:2px;color:var(--muted);margin-top:5px}
.st-xp .r em{font-style:normal;color:var(--blue);font-weight:600}
.status .btn{align-self:center}

/* ---------- PILIERS ---------- */
.pillar{padding:64px 0;border-bottom:1px solid var(--line)}
.pillar.alt{background:var(--panel2)}
.pl-head{display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:center;margin-bottom:38px}
.pl-badge{width:74px;height:74px;border-radius:18px;background:var(--softa);display:flex;align-items:center;justify-content:center;color:var(--acc)}
.pl-badge svg{width:34px;height:34px}
.pl-head h2{font-weight:600;font-size:clamp(1.15rem,2.2vw,1.55rem);color:var(--ink);letter-spacing:-.3px;margin:6px 0 8px}
.pl-desc{color:var(--muted);max-width:66ch;font-size:15px}
.pl-desc b{color:var(--ink);font-weight:600}
.pl-prog{text-align:right}
.pl-prog .n{font-weight:600;font-size:26px;color:var(--ink)}
.pl-prog .l{font-family:var(--fm);font-size:9px;letter-spacing:1.5px;color:var(--muted)}
.tl{position:relative;max-width:880px}
.tl::before{content:'';position:absolute;left:21px;top:22px;bottom:22px;width:2px;background:var(--line);border-radius:1px}
.tl-item{position:relative;display:grid;grid-template-columns:44px 1fr;gap:18px;padding-bottom:18px}
.tl-item::before{content:'';position:absolute;left:20px;top:44px;width:2px;height:calc(100% - 36px);background:var(--acc);opacity:0;transition:opacity .5s}
.tl-item.done::before{opacity:1}
.tl-item.last{padding-bottom:0}
.tl-item.last::before{display:none}
.node{width:44px;height:44px;border-radius:50%;background:var(--panel);border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;position:relative;z-index:2;transition:.3s}
.node span{font-family:var(--fm);font-weight:600;font-size:11px;color:var(--muted)}
.tl-item.done .node{background:var(--acc);border-color:var(--acc)}
.tl-item.done .node span{color:#fff}
.tl-item.next .node{border-color:var(--acc);animation:npulse 2.2s infinite}
.tl-item.next .node span{color:var(--acc)}
@keyframes npulse{0%,100%{box-shadow:0 0 0 0 var(--softa)}50%{box-shadow:0 0 0 7px var(--softa)}}
.tl-card{cursor:pointer;transition:transform .22s,border-color .22s,box-shadow .22s;border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:var(--shadow)}
.tl-card:hover{transform:translateX(5px);border-color:var(--acc)}
.tl-in{padding:18px 24px}
.tl-meta{font-family:var(--fm);font-size:10px;letter-spacing:1.5px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.tl-meta .lm{color:var(--acc);font-weight:600}
.tl-title{font-weight:600;font-size:16.5px;margin-bottom:7px;color:var(--ink)}
.tl-obj{color:var(--muted);font-size:14px;max-width:64ch}
.tl-foot{margin-top:12px;display:flex;align-items:center;justify-content:space-between;font-family:var(--fm);font-size:10.5px;letter-spacing:1px}
.tl-missions{color:var(--muted)}
.tl-state{display:flex;align-items:center;gap:7px;color:var(--muted);transition:.2s}
.tl-state svg{width:14px;height:14px}
.tl-card:hover .tl-state{color:var(--acc)}
.tl-item.done .tl-state{color:var(--acc)}
.tl-item.done .tl-card{opacity:.8}
.tl-item.done .tl-card:hover{opacity:1}
.pf .tl-title{font-size:17.5px}
.pf-band{display:inline-flex;align-items:center;gap:8px;background:var(--softa);color:var(--acc);font-family:var(--fm);font-size:9.5px;letter-spacing:1.5px;padding:5px 12px;margin-bottom:10px;font-weight:600;border-radius:6px}
.pf-obj{display:flex;gap:12px;align-items:flex-start}
.pf-obj svg{flex:none;width:20px;height:20px;color:var(--acc);margin-top:2px}
.pf-obj p{color:var(--muted);font-size:14px}
.pf-obj b{color:var(--ink)}

/* ---------- LEÇON ---------- */
.ls-top{border-bottom:1px solid var(--line);background:rgba(255,255,255,.94);backdrop-filter:blur(8px);position:sticky;top:60px;z-index:40}
.ls-top-in{display:flex;align-items:center;gap:18px;height:50px}
.back{display:flex;align-items:center;gap:8px;background:none;border:none;color:var(--muted);font-family:var(--fm);font-size:11px;letter-spacing:1.5px;transition:.2s;padding:6px 0}
.back:hover{color:var(--blue)}
.ls-crumbs{flex:1;text-align:center;font-family:var(--fm);font-size:11px;letter-spacing:2px;color:var(--muted)}
.ls-crumbs b{color:var(--acc);font-weight:600}
.ls-valid{display:flex;align-items:center;gap:7px;font-family:var(--fm);font-size:10px;letter-spacing:1.5px;color:var(--acc)}
.ls-grid{display:grid;grid-template-columns:280px 1fr;gap:44px;padding:48px 0 90px}
aside{position:sticky;top:124px;align-self:start;display:flex;flex-direction:column;gap:18px}
.as-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.as-t{font-family:var(--fm);font-size:10px;letter-spacing:2px;color:var(--acc);display:flex;align-items:center;gap:9px;margin-bottom:13px}
.as-obj{font-size:13.5px;color:var(--muted);line-height:1.7}
.as-list{list-style:none;display:flex;flex-direction:column;gap:1px}
.as-list a{display:flex;gap:11px;padding:7px 10px;font-size:13px;color:var(--muted);border-left:2px solid transparent;border-radius:0 6px 6px 0;transition:.2s;cursor:pointer}
.as-list a:hover{color:var(--ink);background:var(--panel2)}
.as-list a.on{color:var(--ink);border-left-color:var(--acc);background:var(--softa)}
.as-list a b{font-family:var(--fm);font-size:10.5px;color:var(--line2);font-weight:600;padding-top:2px}
.as-list a.on b{color:var(--acc)}
.as-mis{list-style:none;display:flex;flex-direction:column;gap:9px}
.as-mis li{display:flex;align-items:center;gap:10px;font-family:var(--fm);font-size:11px;letter-spacing:1px;color:var(--muted);cursor:pointer}
.dot{width:9px;height:9px;border:1.5px solid var(--line2);border-radius:50%;flex:none;transition:.3s}
.as-mis li.ok .dot{background:var(--acc);border-color:var(--acc)}
.as-mis li.ok{color:var(--ink)}
.as-bar{height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.as-bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .6s}
.as-pct{font-family:var(--fm);font-size:10px;color:var(--muted);margin-top:9px;letter-spacing:1px}
.as-kubo{display:flex;gap:13px;align-items:center}
.as-kubo .kfig{width:48px;height:48px;flex:none}
.as-kubo .kv{font-family:var(--fm);font-size:10px;letter-spacing:1.5px;color:var(--ink);font-weight:600}
.as-kubo .ks{font-family:var(--fm);font-size:9.5px;color:var(--muted);margin-top:3px}
.as-kubo .kd{width:7px;height:7px;border-radius:50%;background:var(--blue);margin-left:auto;animation:kblink2 1.6s infinite}
@keyframes kblink2{50%{opacity:.3}}
.kubo-intro{display:flex;gap:16px;align-items:flex-start;margin:24px 0;padding:20px 22px;background:var(--softa);border:1px solid var(--line2);border-radius:12px}
.kubo-intro .kfig{width:60px;height:60px;flex:none}
.kubo-intro .kt{font-family:var(--fm);font-size:9.5px;letter-spacing:2px;color:var(--acc);font-weight:600;margin-bottom:6px}
.kubo-intro .km{font-size:14.5px;color:var(--body)}
.kubo-intro .km b{color:var(--ink)}
.kubo-note{display:flex;gap:12px;align-items:flex-start;margin:18px 0}
.kubo-note .kfig{width:38px;height:38px;flex:none}
.kubo-note .kb-say{font-size:13.5px;padding:11px 15px;max-width:none;flex:1}
.kubo-note .kb-say::after{left:18px;bottom:-6px;width:11px;height:11px}
.kubo-note .kb-say b{color:var(--acc)}
.ls-head h2{font-weight:600;font-size:clamp(1.4rem,2.8vw,2.1rem);letter-spacing:-.4px;margin:12px 0 4px;color:var(--ink)}
.ls-metarow{display:flex;gap:10px;flex-wrap:wrap;font-family:var(--fm);font-size:10.5px;letter-spacing:1.5px;color:var(--muted)}
.tag{border:1px solid var(--line2);background:var(--panel);padding:5px 12px;border-radius:7px;display:inline-flex;align-items:center;gap:7px}
.tag svg{width:12px;height:12px}
.tag.t-acc{border-color:var(--acc);color:var(--acc)}
.step{padding:32px 0;border-top:1px solid var(--line);scroll-margin-top:120px}
.step-k{font-family:var(--fm);font-size:10.5px;letter-spacing:2.5px;color:var(--acc);margin-bottom:10px;display:flex;align-items:center;gap:12px}
.step-k::after{content:'';flex:1;height:1px;background:var(--line)}
.step h3{font-size:18px;font-weight:600;letter-spacing:-.2px;margin-bottom:13px;color:var(--ink)}
.step-b{color:var(--body);font-size:15px}
.step-b b{color:var(--ink);font-weight:600}
.step-b code{font-family:var(--fm);font-size:.88em;background:var(--soft);border:1px solid var(--line2);padding:1px 6px;border-radius:5px;color:var(--navy)}
ul.dash{list-style:none;margin:13px 0;display:flex;flex-direction:column;gap:7px}
ul.dash li{padding-left:20px;position:relative;color:var(--muted)}
ul.dash li::before{content:'';position:absolute;left:2px;top:10px;width:6px;height:6px;background:var(--acc);border-radius:2px}
ul.dash li b{color:var(--ink);font-weight:600}
ul.mono{list-style:none;font-family:var(--fm);font-size:12px;margin:13px 0;display:flex;flex-direction:column;gap:8px}
ul.mono li{border:1px solid var(--line);background:var(--panel);padding:9px 14px;color:var(--muted);border-radius:8px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
ul.mono li i{font-style:normal;color:var(--amber)}
.code{margin:18px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#F8FAFE}
.code-bar{display:flex;justify-content:space-between;align-items:center;padding:7px 10px 7px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.code-file{font-family:var(--fm);font-size:11px;color:var(--muted)}
.code-file::before{content:'● ';color:var(--blue)}
.copy-btn{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--muted);font-family:var(--fm);font-size:9.5px;letter-spacing:1px;padding:5px 11px;transition:.2s}
.copy-btn:hover{color:var(--blue);border-color:var(--blue)}
.copy-btn svg{width:12px;height:12px}
.code pre{padding:16px 20px;font-family:var(--fm);font-size:13px;line-height:1.85;overflow-x:auto;color:#2A3B5E}
.tok-k{color:#0B5FCC}.tok-s{color:#B25E09}.tok-c{color:#8A94AD;font-style:italic}
.tok-n{color:#0E8A6D}.tok-b{color:#0E3E9E;font-weight:600}.tok-m{color:#5C6B8A}
.tip{margin:18px 0;border:1px solid var(--line2);border-left:3px solid var(--acc);background:var(--softa);border-radius:0 10px 10px 0;padding:15px 19px;display:flex;gap:13px;align-items:flex-start}
.tip svg{color:var(--acc);flex:none;margin-top:3px}
.tip p{font-size:13.5px;color:var(--body)}
.tip p b{color:var(--ink)}

<script>
(function(){
  var b=document.getElementById('boot');
  if(!b)return;
  var done=false;
  function finish(){
    if(done)return;done=true;
    b.classList.add('done');
    setTimeout(function(){if(b.parentNode)b.parentNode.removeChild(b);},600);
  }
  b.addEventListener('click',finish);
  document.addEventListener('keydown',function onKey(e){
    if(e.key==='Escape'||e.key==='Enter'){finish();document.removeEventListener('keydown',onKey);}
  });
  var lines=['> BLOX//FORGE — v4.3','> initialisation des deux piliers ...... OK','> BUILD · 4 leçons chargées ............ OK','> CODE · 3 leçons chargées ............. OK','> réveil de l\u2019unité KUBO ............... OK'];
  var box=document.getElementById('bootLines');
  for(var i=0;i<lines.length;i++){
    (function(txt,idx){
      var d=document.createElement('div');d.textContent=txt;
      if(idx>0)d.className='ok';
      d.style.animationDelay=(idx*0.2)+'s';
      box.appendChild(d);
    })(lines[i],i);
  }
  setTimeout(function(){var bar=document.getElementById('bootBar');if(bar)bar.style.width='100%';},80);
  setTimeout(function(){var k=document.getElementById('bootKubo');if(k)k.classList.add('on');},1300);
  setTimeout(finish,2400);
})();
</script>

<script>

'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const shuffle=a=>{const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[r[i],r[j]]=[r[j],r[i]];}return r;};

/* ---------- KUBO ---------- */
function kuboSVG(mood){
  const eye='#9BC9FF', ant='#E8930C', ink='#16233F';
  let eyes,mouth,extra='';
  if(mood==='happy'){
    eyes='<g class="kbl" fill="none" stroke="'+eye+'" stroke-width="4.5" stroke-linecap="round"><path d="M41 60 Q47.5 51 54 60"/><path d="M66 60 Q72.5 51 79 60"/></g>';
    mouth='<path d="M50 71 Q60 83 70 71 Z" fill="'+eye+'"/>';
  }else if(mood==='think'){
    eyes='<g class="kbl" fill="'+eye+'"><circle cx="47.5" cy="58" r="6"/><circle cx="72.5" cy="58" r="2.8"/></g>';
    mouth='<path d="M54 76 L66 76" stroke="'+eye+'" stroke-width="3" stroke-linecap="round" fill="none"/>';
    extra='<text x="88" y="34" font-family="\'IBM Plex Mono\',monospace" font-size="15" font-weight="600" fill="'+ant+'" transform="rotate(12 88 34)">?</text>';
  }else if(mood==='star'){
    eyes='<g fill="'+eye+'"><circle cx="47.5" cy="58" r="6.5"/><circle cx="72.5" cy="58" r="6.5"/><circle cx="45" cy="55.5" r="1.8" fill="#fff"/><circle cx="70" cy="55.5" r="1.8" fill="#fff"/></g>';
    mouth='<path d="M48 70 Q60 87 72 70 Z" fill="'+eye+'"/>';
    extra='<g class="ksp"><rect x="9" y="28" width="7" height="7" fill="'+ant+'" transform="rotate(45 12.5 31.5)"/><rect x="100" y="20" width="6" height="6" fill="'+eye+'" transform="rotate(45 103 23)"/><rect x="104" y="52" width="5" height="5" fill="'+ant+'" transform="rotate(45 106.5 54.5)"/></g>';
  }else{
    eyes='<g class="kbl" fill="'+eye+'"><circle cx="47.5" cy="58" r="6"/><circle cx="72.5" cy="58" r="6"/></g>';
    mouth='<path d="M54 74 Q60 79 66 74" stroke="'+eye+'" stroke-width="3.5" fill="none" stroke-linecap="round"/>';
  }
  const lift=(mood==='happy'||mood==='star');
  const arm=(x,rot)=>'<g transform="rotate('+rot+' '+(x+7)+' 62)"><rect x="'+x+'" y="58" width="14" height="24" rx="7" fill="#fff" stroke="'+ink+'" stroke-width="3"/></g>';
  return '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">'
    +'<ellipse cx="60" cy="112" rx="27" ry="4.5" fill="rgba(22,35,63,.10)"/>'

    +eyes+mouth
    +'<circle cx="60" cy="93" r="3" fill="'+ant+'" opacity=".85"/>'
    +extra+'</svg>';
}

const RANKS=[[0,'NOVICE'],[200,'BUILDER'],[500,'SCRIPTEUR'],[900,'ARCHITECTE'],[1400,'CRÉATEUR'],[1749,'LÉGENDE']];

{
id:'b1',pillar:'build',pnum:'B01',title:'Prendre en main Roblox Studio',dur:'15 MIN',lvl:'DÉBUTANT',
obj:'Installer Roblox Studio, créer ton premier projet et te repérer dans l\u2019interface sans te perdre.',
kintro:'Bienvenue dans le <b>pilier BUILD</b> ! Ici, on construit tout ce qui se voit et se touche. Première mission : installer notre atelier, Roblox Studio. Je reste avec toi à chaque étape.',
steps:[
{t:'Installe Roblox Studio',b:'<p>Avant de construire des mondes, il te faut l\u2019outil officiel : <b>Roblox Studio</b>. Il est gratuit et fonctionne sur Windows comme macOS.</p><ul class="dash"><li>Rends-toi sur <b>roblox.com/create</b> et clique sur « Start Creating ».</li><li>Pas de compte ? Crées-en un : il sert aussi à jouer et à publier tes jeux.</li><li>Installe Studio, lance-le et connecte-toi avec ton compte.</li></ul>',
tip:'Ton compte Roblox est ta clé unique : il regroupe tes jeux, tes amis et tes créations. Choisis un pseudo dont tu seras fier — toute la communauté le verra.'},
{t:'Crée ton premier projet',b:'<p>À l\u2019ouverture, Studio te propose des <b>modèles de départ</b> (templates). Pour apprendre, rien ne vaut une base épurée.</p><ul class="dash"><li>Sélectionne le modèle <b>Baseplate</b> : un monde vide avec une grande plateforme grise.</li><li>Donne un nom à ton fichier via <b>Fichier → Enregistrer sous</b> (ex. « MonPremierJeu »).</li><li>Te voilà dans la vue 3D : ton monde existe, il n\u2019attend que toi.</li></ul>',
say:'Ce Baseplate, c\u2019est notre page blanche à nous. Sauvegarde souvent : je déteste voir disparaître du beau travail.'},
{t:'Repère-toi dans l\u2019interface',b:'<p>Studio affiche plusieurs fenêtres. Trois vont devenir tes meilleures amies :</p><ul class="dash"><li><b>La vue 3D</b> (au centre) : ton monde, observable sous tous les angles.</li><li><b>L\u2019Explorer</b> (à droite) : l\u2019arbre de tous les objets — Workspace, Lighting, Players…</li><li><b>Les Properties</b> (juste à côté) : les propriétés de l\u2019objet sélectionné.</li></ul><p>Fais le test tout de suite : clique sur <b>Baseplate</b> dans l\u2019Explorer et observe la fenêtre Properties se remplir. Chaque objet est une boîte d\u2019informations que tu peux modifier en direct.</p>',
say:'Grave-toi ce duo en mémoire : <b>Explorer + Properties</b>. C\u2019est notre table de travail — je t\u2019y ramènerai tout au long du cursus.'},
{t:'Maîtrise la caméra',b:'<p>Un bon créateur se déplace vite dans son monde. Les gestes à connaître par cœur :</p><ul class="mono"><li><b>Zoomer</b><i>molette de la souris</i></li><li><b>Tourner la vue</b><i>clic droit maintenu + souris</i></li><li><b>Se déplacer</b><i>clic droit maintenu + Z Q S D</i></li><li><b>Focus sur un objet</b><i>sélectionne-le puis touche F</i></li></ul>',
tip:'Perdu dans le vide cosmique ? Clique sur un objet dans l\u2019Explorer puis appuie sur F : la caméra saute directement dessus.'},
{t:'Sauvegarde et publie',b:'<p>Deux réflexes à prendre dès aujourd\u2019hui :</p><ul class="dash"><li><b>Ctrl + S</b> (ou ⌘ + S) enregistre ton fichier en local, sur ta machine.</li><li><b>Fichier → Publier sur Roblox</b> envoie ton jeu sur les serveurs Roblox : il devient joignable en ligne.</li></ul><p>Attention : <b>publier ne rend pas ton jeu public</b>. La visibilité se règle séparément — on s\u2019en occupe à la leçon <b>BUILD 04</b>.</p>'}
],

why:'L\u2019Explorer est l\u2019arbre complet des objets : Workspace, Lighting, scripts… tout y est rangé.'},
{type:'order',q:'Remets dans l\u2019ordre les étapes de ton tout premier projet :',

{
id:'b2',pillar:'build',pnum:'B02',title:'Construire avec des parts',dur:'20 MIN',lvl:'DÉBUTANT',
obj:'Créer, déplacer, redimensionner et ancrer des parts pour bâtir ta première zone de jeu.',
kintro:'L\u2019atelier est prêt. Maintenant, les <b>briques</b> ! Les parts sont les atomes de tout jeu Roblox : tours, ponts, murs… tout commence ici.',
steps:[
{t:'Ta première part',b:'<p>Direction l\u2019onglet <b>Modèle</b> → bouton <b>Part</b> : une part grise apparaît au centre de ton monde.</p><p>Une part est l\u2019objet le plus simple de Roblox : une boîte avec une position, une taille et une couleur. Essaie aussi les formes du menu déroulant : <b>sphère</b>, <b>cylindre</b>, <b>coin</b> (wedge).</p><p>Dans l\u2019Explorer, la part apparaît dans <b>Workspace</b>. Renomme-la immédiatement (clic droit → Renommer) : une liste de 47 « Part » dans un projet, c\u2019est le chaos garanti.</p>'},
{t:'Déplace, tourne, redimensionne',b:'<p>Studio te donne trois outils principaux, dans l\u2019onglet Accueil / Modèle :</p><ul class="dash"><li><b>Déplacer</b> : glisse la part sur la grille.</li><li><b>Redimensionner</b> : tire les poignées pour la taille.</li><li><b>Tourner</b> : pivote par incréments.</li></ul><p>Les déplacements s\u2019alignent automatiquement sur la grille (les fameux « studs ») : c\u2019est ce qui rend les constructions propres. On peut désactiver cet alignage, mais reste collé à la grille autant que possible.</p>',
tip:'Raccourcis à mémoriser : Ctrl + 2 (déplacer), Ctrl + 3 (redimensionner), Ctrl + 4 (tourner). Ils te feront gagner un temps fou.'},
{t:'L\u2019apparence : matériau et couleur',b:'<p>Sélectionne ta part, puis ouvre les <b>Properties</b> :</p><ul class="dash"><li><b>Material</b> : Neon (néon lumineux), Wood, Metal, Grass… change tout le rendu de surface.</li><li><b>Color</b> : la teinte de la part.</li><li><b>Transparency</b> : 0 = opaque, 1 = invisible.</li><li><b>Reflectance</b> : effet miroir.</li></ul><p>Essaie une plaque avec <b>Material = Neon</b> : elle semble éclairer les alentours — parfait pour un checkpoint visible de loin.</p>'},
{t:'Anchored : la propriété qui sauve des vies',b:'<p>Par défaut, une part est <b>simulée par le moteur physique</b> : dès que le jeu démarre, elle tombe. Tout sauf ce que tu veux pour un sol.</p><ul class="dash"><li><b>Anchored = true</b> → la part est figée : elle ne tombe plus, on peut marcher dessus.</li><li>Règle d\u2019or : <b>tout ce qui doit rester en place</b> (sol, murs, plateformes) doit être ancré.</li></ul><p>Le piège classique du débutant : lancer le jeu et regarder sa tour soigneusement construite s\u2019effondrer en direct.</p>',
say:'Je dis ça, je dis rien… mais 90 % des tours effondrées que j\u2019ai vues, c\u2019était un <b>Anchored</b> oublié. Vérifie-le religieusement.'},
{t:'Duplique et groupe',b:'<ul class="dash"><li><b>Ctrl + D</b> : duplique l\u2019objet sélectionné, position relative conservée.</li><li><b>Ctrl + clic</b> : sélectionne plusieurs objets.</li><li><b>Ctrl + G</b> : regroupe le tout dans un <b>Model</b>, que tu nommes.</li></ul><p>Un Model rassemble des objets : sélectionner et déplacer une maison entière devient un jeu d\u2019enfant.</p>',
challenge:'Défi : construis une plateforme de départ de 20 × 1 × 20 studs, matériau au choix, <b>ancrée</b>. C\u2019est la fondation de ton obby au Projet Final (pilier CODE).'}
],
exos:[
{type:'mcq',q:'Tu lances le jeu : ta plateforme s\u2019effondre lamentablement. Quelle propriété dois-tu régler ?',
opts:['Transparency','Anchored','Color','Reflectance'],a:1,
why:'Anchored retire la part de la simulation physique : elle reste figée en l\u2019air, exactement où tu l\u2019as posée.'},
{type:'fill',q:'Complète le réglage pour que la part ne tombe plus :',

extra:['Transparency','false']},
{type:'order',q:'Remets en ordre la construction d\u2019un mur propre :',
items:['Créer la part','La redimensionner','La positionner et l\u2019aligner à la grille','Activer Anchored']}
]},
{
id:'b3',pillar:'build',pnum:'B03',title:'Terrain, lumière et ambiance',dur:'15 MIN',lvl:'DÉBUTANT',
obj:'Sculpter un terrain naturel et régler l\u2019atmosphère de ton jeu.',
kintro:'Un monde sans ambiance, c\u2019est triste même pour un robot. Aujourd\u2019hui : on sculpte la terre, on règle le soleil. Tes joueurs te remercieront.',
steps:[
{t:'Ouvre l\u2019éditeur de terrain',b:'<p>Direction l\u2019onglet <b>Modèle → Éditeur de terrain</b> (ou via le panneau Vue).</p><p>L\u2019outil propose trois modes : <b>Générer</b> (créer un terrain automatiquement), <b>Éditer</b> (sculpter à la main) et <b>Région</b> (opérations par zones). On commence par générer une base.</p>'},
{t:'Génère une île',b:'<ul class="dash"><li>Mode <b>Générer</b> → clique sur « Générer » (îles par défaut).</li><li>Règle la <b>taille de la carte</b> : 512 est un bon départ pour apprendre.</li><li>Studio crée collines, vallées et plans d\u2019eau. C\u2019est une base à sculpter ensuite.</li></ul>'},
{t:'Sculpte avec les pinceaux',b:'<ul class="dash"><li>Mode <b>Éditer</b> : choisis un pinceau — <b>Ajouter</b>, <b>Retirer</b>, <b>Aplanir</b>, <b>Lisser</b>…</li><li>Règle la taille et la forme du pinceau, puis « peins » directement dans la vue 3D.</li><li><b>Aplanir</b> est ton allié pour créer une zone d\u2019apparition bien plate.</li></ul>',
tip:'Alterne Ajouter et Lisser pour obtenir un relief naturel : un terrain uniquement « ajouté » ressemble à des tas de patates.'},
{t:'Dirige la lumière',b:'<p>L\u2019objet <b>Lighting</b> dans l\u2019Explorer pilote toute l\u2019ambiance du jeu :</p><ul class="dash"><li><b>ClockTime</b> : l\u2019heure du jour (12 = midi, 18 = soir, 0 = nuit).</li><li><b>Brightness</b> : l\u2019intensité du soleil.</li><li><b>FogEnd</b> : distance à laquelle le brouillard masque tout.</li></ul><p>Trois recettes prêtes à l\u2019emploi :</p><ul class="mono"><li><b>Matin clair</b><i>ClockTime 8 · Brightness 3 · FogEnd 100000</i></li><li><b>Soir dramatique</b><i>ClockTime 18 · Brightness 2 · FogEnd 400</i></li><li><b>Nuit mystérieuse</b><i>ClockTime 0 · Brightness 1 · FogEnd 150</i></li></ul><p>Pour un ciel réaliste, insère un objet <b>Atmosphere</b> dans Lighting (bouton + à côté de son nom).</p>'},
{t:'Teste en mode Play… avec prudence',b:'<ul class="dash"><li>Bouton <b>Play</b> (ou F5) : lance le jeu avec ton avatar dedans.</li><li><b>Shift + F5</b> : arrête le test.</li></ul><p>Règle cruciale : en mode Play, Studio travaille sur une <b>copie temporaire</b> de ton monde. Les modifications faites pendant le test <b>disparaissent à l\u2019arrêt</b>.</p>',
say:'Retiens mon truc à moi : le mode Play, c\u2019est du sable magique — tout s\u2019efface à l\u2019arrêt. <b>Teste, arrête, modifie, reteste.</b> Jamais l\u2019inverse.'}
],
exos:[
{type:'mcq',q:'Tu veux une ambiance « soir d\u2019été, lumière rasante ». Quelle valeur de ClockTime choisir ?',
opts:['2','12','18.5','6'],a:2,
why:'ClockTime se compte en heures : autour de 18, le soleil est bas sur l\u2019horizon — exactement l\u2019effet recherché.'},
{type:'tf',q:'Les changements effectués pendant le mode Play sont conservés après l\u2019arrêt.',a:false,
why:'Le mode Play lance une copie temporaire : tout ce que tu modifies pendant le test est jeté à l\u2019arrêt. Edite toujours hors test.'},
{type:'order',q:'Remets dans l\u2019ordre la création d\u2019un monde :',
items:['Ouvrir l\u2019éditeur de terrain','Générer une île','Sculpter et aplanir une zone','Régler Lighting','Tester en mode Play']}
]},
{
id:'b4',pillar:'build',pnum:'B04',title:'Interface et publication',dur:'25 MIN',lvl:'INTERMÉDIAIRE',
obj:'Afficher des informations à l\u2019écran et publier ton jeu pour que le monde entier y joue.',
kintro:'Dernière ligne droite du pilier BUILD : on habille ton jeu d\u2019une interface, et on l\u2019envoie <b>en ligne</b>. Le moment que je préfère — mes circuits vibrent rien que d\u2019y penser.',
steps:[
{t:'Ton premier TextLabel',b:'<p>L\u2019interface (UI) vit dans <b>StarterGui</b> : ce dossier est copié sur l\u2019écran de chaque joueur au lancement.</p><ul class="dash"><li>Dans l\u2019Explorer : survole <b>StarterGui</b> → <b>+</b> → <b>ScreenGui</b>.</li><li>Puis <b>+</b> sur le ScreenGui → <b>TextLabel</b>.</li><li>Règle dans Properties : <b>Text</b>, <b>TextSize</b>, <b>TextColor3</b>, <b>BackgroundTransparency</b> (0.3 = discret).</li></ul><p>Le ScreenGui est la couche écran ; labels et boutons sont ses enfants. Glisse-les directement dans la vue pendant le mode Play pour les positionner.</p>'},
{t:'LocalScript : le côté joueur',b:'<p>Pour l\u2019UI, on n\u2019utilise pas un Script classique mais un <b>LocalScript</b> : il tourne sur la machine du joueur (le client) — bien plus réactif pour l\u2019écran.</p><ul class="dash"><li>Clic droit sur le TextLabel → <b>Insérer un objet</b> → <b>LocalScript</b>.</li></ul>',
code:'local label = script.Parent\n\nlabel.Text = "Bienvenue dans l\'obby !"',
b2:'<p>Ici, <b>script.Parent</b> = le parent du script = le TextLabel. Le texte change dès le lancement. C\u2019est ta première touche de code — un avant-goût du pilier CODE !</p>'},
{t:'Anime : un compte à rebours',b:'<p>Un vrai bout de logique de jeu : la boucle <b>for</b> compte de 10 à 1 en reculant (le -1), une seconde par tour :</p>',
code:'local label = script.Parent\n\nfor i = 10, 1, -1 do\n  label.Text = "Départ dans " .. i .. "..."\n  task.wait(1)\nend\n\nlabel.Text = "GO !"',
b2:'<p>Changer un texte au bon moment, à distance : c\u2019est très exactement le métier de développeur de jeu.</p>'},
{t:'Publie ton jeu',b:'<ul class="dash"><li><b>Fichier → Publier sur Roblox</b> : renseigne nom, description et genre, puis « Créer ».</li><li>À partir de maintenant, chaque <b>Ctrl + S</b> enregistre directement dans cette version en ligne.</li><li>Publier ne rend pas le jeu public : va dans <b>Accueil → Paramètres du jeu → Permissions</b> → passe en <b>Public</b>.</li></ul><p>Sur la page web de ton jeu, tu récupères le lien à partager avec qui tu veux.</p>',
say:'Le <b>lien de partage</b>… cette petite ligne de texte qui transforme ton projet en jeu jouable par le monde entier. Savoure ce moment, créateur.'},
{t:'Et maintenant ?',b:'<p>Ton premier jeu est en ligne. Pour aller plus loin :</p><ul class="dash"><li><b>Badges</b> : des récompenses automatiques, configurables sur le site créateur.</li><li><b>Passes de jeu</b> (gamepasses) : la monétisation, en vendant des avantages.</li><li><b>DataStores</b> : sauvegarder la progression des joueurs entre deux sessions.</li><li>Et surtout : fais tester ton jeu à des amis, observe où ils bloquent, améliore.</li></ul>',
tip:'Un bon jeu n\u2019est jamais « fini » : il se teste, se corrige, se reboucle. Publie tôt, améliore souvent — c\u2019est la méthode des meilleurs créateurs Roblox.'}
],
exos:[
{type:'mcq',q:'Où places-tu un ScreenGui pour qu\u2019il s\u2019affiche pour tous les joueurs ?',
opts:['Dans Workspace','Dans ServerScriptService','Dans StarterGui','Dans Lighting'],a:2,
why:'StarterGui est copié dans l\u2019écran de chaque joueur au lancement : c\u2019est la porte d\u2019entrée standard de toute interface.'},
{type:'fill',q:'Fais patienter le script avant d\u2019afficher le message :',
code:'local label = script.‹Parent›\n‹task›.wait(2)\nlabel.Text = "GO !"',
extra:['wait','Name']},
{type:'tf',q:'Publier ton jeu le rend immédiatement jouable par tous les Robloxiens.',a:false,
why:'Publier envoie le jeu sur les serveurs Roblox, mais la visibilité se règle à part : Permissions → Public dans les paramètres du jeu.'}
]},
{
id:'c1',pillar:'lua',pnum:'C01',title:'Lua : tes premiers scripts',dur:'25 MIN',lvl:'INTERMÉDIAIRE',
obj:'Écrire, exécuter et comprendre tes premières lignes de Lua, le langage de Roblox.',
kintro:'Changement de pilier ! Place au <b>CODE</b> : Lua, mon langage préféré — après le binaire, évidemment. Ici, ton monde cesse d\u2019être une maquette… et commence à <b>penser</b>.',
steps:[
{t:'Où vivent les scripts ?',b:'<p>Un script est un fichier de code qui donne des ordres au jeu. Pour la <b>logique du jeu</b> (règles, points, dégâts), un seul endroit :</p><ul class="dash"><li>Dans l\u2019Explorer, survole <b>ServerScriptService</b>, clique le <b>+</b>, choisis <b>Script</b>.</li></ul><p>ServerScriptService exécute les scripts <b>côté serveur</b> : mêmes règles pour tous les joueurs, et la triche y est bien plus difficile.</p>'},
{t:'Bonjour, Roblox',b:'<p>Dans ton script tout neuf, écris cette ligne, puis lance le jeu (F5) et ouvre la fenêtre <b>Output</b> via <b>Affichage → Output</b> :</p>',
code:'print("Bonjour Roblox !")',
say:'<b>print</b> est ton amie de confiance : quand tu ne comprends pas ce qui se passe, fais-lui cracher la vérité dans l\u2019Output.',
tip:'print est l\u2019outil n°1 du créateur : il affiche des messages pour vérifier que le code tourne. Tu l\u2019utiliseras des milliers de fois.'},
{t:'Les variables',b:'<p>Une <b>variable</b> est une boîte nommée qui stocke une valeur. Le mot-clé <b>local</b> la crée :</p>',
code:'local nomDuJeu = "Forteresse Oubliée"\nlocal vitesse = 16\nlocal estTermine = false\n\nprint(nomDuJeu)',
b2:'<p>Les types essentiels : <b>string</b> (texte, entre guillemets), <b>number</b> (nombre), <b>boolean</b> (true / false) et <b>nil</b> (vide).</p>'},
{t:'Combine et calcule',b:'<p>L\u2019opérateur <b>..</b> colle deux textes (concaténation). Les classiques <b>+ - * /</b> fonctionnent sur les nombres :</p>',
code:'local prenom = "Alex"\nlocal points = 120\n\nprint("Joueur : " .. prenom)  -- Joueur : Alex\nprint(points + 30)            -- 150\nprint("Score : " .. points)   -- Score : 120'},
{t:'Commentaires et erreurs',b:'<ul class="dash"><li><b>--</b> en début de ligne = commentaire : ignoré par Lua, précieux pour les humains.</li><li>Quand ça plante, l\u2019<b>Output</b> affiche l\u2019erreur en rouge <b>avec son numéro de ligne</b> — lis-le, il est d\u2019une précision chirurgicale.</li><li>Erreurs classiques : guillemet ou parenthèse oubliés.</li></ul>',
tip:'En Lua, la casse compte : Points et points sont deux variables totalement différentes. La source d\u2019erreurs la plus répandue chez les débutants.'}
],
exos:[
{type:'fill',q:'Affiche un message dans l\u2019Output avec la variable déjà déclarée :',
code:'local nomDuJeu = "Forteresse Oubliée"\n‹print›("Bienvenue dans " .. ‹nomDuJeu›)',
extra:['print()','"nomDuJeu"','output']},
{type:'mcq',q:'Quel est le type de la valeur stockée dans <code>local estTermine = false</code> ?',
opts:['string','number','boolean','nil'],a:2,
why:'true et false sont les deux valeurs du type boolean — le type oui/non par excellence.'},
{type:'tf',q:'En Lua, les variables Nom et nom désignent la même chose.',a:false,
why:'Lua est sensible à la casse : Nom, nom et NOM sont trois variables distinctes. La casse compte, toujours.'}
]},
{
id:'c2',pillar:'lua',pnum:'C02',title:'Événements et conditions',dur:'30 MIN',lvl:'INTERMÉDIAIRE',
obj:'Faire réagir ton jeu : détecter un contact, tester des conditions, créer une plateforme réactive.',
kintro:'Événements et conditions : ici ton monde cesse d\u2019être décoré… et commence à <b>RÉAGIR</b>. C\u2019est ma leçon préférée du pilier CODE.',
steps:[
{t:'Le principe des événements',b:'<p>Un script peut <b>écouter</b> ce qui se passe dans le monde. L\u2019événement le plus utilisé : <b>Touched</b>, déclenché dès qu\u2019un objet touche la part.</p>',
code:'local part = script.Parent\n\npart.Touched:Connect(function()\n  print("Quelque chose m\'a touché !")\nend)',
b2:'<p>Ce script se place <b>à l\u2019intérieur de la part</b> (glisse-le sur elle dans l\u2019Explorer) : <b>script.Parent</b> désigne alors la part elle-même. Le bloc <b>:Connect(function() ... end)</b> signifie : « quand ça arrive, exécute ce code ».</p>'},
{t:'Identifie ce qui touche',b:'<p>Touched fournit un paramètre (souvent nommé <b>hit</b>) : la part qui entre en collision. Comme le corps du joueur est un Model, on vérifie son identité :</p>',
code:'local Players = game:GetService("Players")\nlocal part = script.Parent\n\npart.Touched:Connect(function(hit)\n  local joueur = Players:GetPlayerFromCharacter(hit.Parent)\n  if joueur then\n    print(joueur.Name .. " est passé par ici !")\n  end\nend)',
b2:'<p><b>GetPlayerFromCharacter</b> renvoie le joueur si hit.Parent est un personnage, sinon <b>nil</b> — d\u2019où le <b>if joueur then</b>.</p>'},
{t:'Les conditions',b:'<p>Le trio <b>if / elseif / else</b> prend des décisions. Les comparateurs : <b>==</b> (égal), <b>~=</b> (différent), <b>&gt; &lt; &gt;= &lt;=</b>, reliés par <b>and / or / not</b> :</p>',

/* ============================================================
   COLORATION LUA
   ============================================================ */
const LUA_RE=/(--[^\n]*)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|\b(local|function|end|if|then|elseif|else|for|while|do|return|break|true|false|nil|and|or|not|in|repeat|until)\b|\b(print|game|workspace|script|Instance|task|Enum|Players|BrickColor)\b|(\b\d+(?:\.\d+)?\b)|(\.[A-Za-z_]\w*)/g;
function hlLua(src){
  let out='',last=0,m;LUA_RE.lastIndex=0;
  while((m=LUA_RE.exec(src))){
    if(m.index>last)out+=esc(src.slice(last,m.index));
    const cls=m[1]?'tok-c':m[2]?'tok-s':m[3]?'tok-k':m[4]?'tok-b':m[5]?'tok-n':'tok-m';
    out+='<span class="'+cls+'">'+esc(m[0])+'</span>';
    last=m.index+m[0].length;
  }
  return out+esc(src.slice(last));
}

function toast(msg,icon){
  const t=document.createElement('div');t.className='toast';
  t.innerHTML='<i data-lucide="'+(icon||'check')+'"></i><span>'+msg+'</span>';
  $('#toasts').appendChild(t);refreshIcons();
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),320);},3000);
}
function addXP(n){
  const before=rankOf(state.xp);
  const from=state.xp;state.xp+=n;save();updateHeader();
  const el=$('#hdXP');el.classList.add('pump');setTimeout(()=>el.classList.remove('pump'),250);
  let t0=null;const anim=ts=>{if(!t0)t0=ts;const k=Math.min((ts-t0)/500,1);
    el.textContent=Math.round(from+(state.xp-from)*k)+' XP';if(k<1)requestAnimationFrame(anim);};
  requestAnimationFrame(anim);
  const after=rankOf(state.xp);
  if(after!==before)kuboSpeak('Nouveau rang débloqué : <b>'+after+'</b> ! Mes circuits chauffent de fierté.','star',6000);
}
function sparkle(x,y){
  const cols=['#1B5BD6','#16233F','#9BC9FF'];
  for(let i=0;i<18;i++){
    const s=document.createElement('i');s.className='spark';
    const a=Math.random()*Math.PI*2,d=60+Math.random()*110;
    s.style.left=x+'px';s.style.top=y+'px';
    s.style.background=cols[i%3];
    s.style.setProperty('--dx',Math.cos(a)*d+'px');
    s.style.setProperty('--dy',Math.sin(a)*d-30+'px');
    s.style.setProperty('--rr',(Math.random()*720-360)+'deg');
    document.body.appendChild(s);
    s.addEventListener('animationend',()=>s.remove());
  }
}

const app=$('#app');
const revealObs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('rv-in');revealObs.unobserve(e.target);}}),{threshold:.1});
function setView(el){
  const old=app.firstElementChild;
  if(old){old.classList.add('view-out');
    setTimeout(()=>{old.replaceWith(el);el.classList.add('view-in');window.scrollTo(0,0);afterRender();},180);
  }else{app.appendChild(el);el.classList.add('view-in');afterRender();}
}
function afterRender(){
  refreshIcons();
  $$('.rv').forEach(o=>revealObs.observe(o));
  /* filet de sécurité : tout contenu finit visible */
  setTimeout(()=>{$$('.rv').forEach(el=>el.classList.add('rv-in'));},2500);
}
function elFromHTML(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstElementChild;}

  +'<section class="exos-sec" id="exos"><div class="exos-head rv"><h2>Missions</h2><p>// VALIDE TES ACQUIS — '+(L.exos.length*50)+' XP À GAGNER</p></div>'
  +'<div id="exList"></div>'
  +'<div class="finish card" id="finishBox"><div class="finish-in"><div class="fx">'
  +'<div class="finish-t" id="finT">Validation de la leçon</div><div class="finish-s" id="finS"></div></div>'
  +'<button class="btn-fin" id="finBtn" disabled><i data-lucide="lock"></i>MISSIONS REQUISES</button>'
  +'</div></div></section>'
  +'<div class="ls-nav">'
  +(prev?'<div class="navc card" data-open="'+prev.id+'"><span class="nv-l"><i data-lucide="arrow-left"></i>LEÇON PRÉCÉDENTE</span><span class="nv-t">'+prev.title+'</span></div>'
       :'<div class="navc card" data-home><span class="nv-l"><i data-lucide="map"></i>RETOUR</span><span class="nv-t">Les deux piliers</span></div>')
  +(next?'<div class="navc card nx" data-open="'+next.id+'"><span class="nv-l r">LEÇON SUIVANTE<i data-lucide="arrow-right"></i></span><span class="nv-t">'+next.title+'</span></div>'
       :'<div class="navc card nx" data-home><span class="nv-l r"><i data-lucide="award"></i>FIN DU CURSUS</span><span class="nv-t">Retour au tableau de bord</span></div>')
  +'</div></div></div></div>');

  setView(v);
  const exList=v.querySelector('#exList');
  L.exos.forEach((ex,k)=>exList.appendChild(renderExercise(L,ex,k)));
  window._CODES=CODES;
  updateLessonUI();
  setupSpy(v);

  const finBtn=v.querySelector('#finBtn');
  finBtn.addEventListener('click',()=>{
    if(finBtn.disabled||lessonDone(L))return;
    state.done.push(L.id);save();addXP(100);
    const r=finBtn.getBoundingClientRect();
    sparkle(r.left+r.width/2,r.top+r.height/2);
    kuboSpeak('Leçon <b>'+L.pnum+' validée</b> ! +100 XP. On grimpe, créateur.','star',6000);
    toast('Leçon validée — +100 XP','award');
    updateLessonUI();updateHeader();
    const nx=LESSONS[i+1];
    if(nx)setTimeout(()=>{finBtn.innerHTML='<i data-lucide="arrow-right"></i>LEÇON SUIVANTE';finBtn.disabled=false;finBtn.onclick=()=>openLesson(nx.id);refreshIcons();},1400);
    else{finBtn.innerHTML='<i data-lucide="map"></i>RETOUR AU PARCOURS';finBtn.disabled=false;finBtn.onclick=()=>goHome();refreshIcons();}
    refreshIcons();
  });

  setTimeout(()=>kuboSpeak('Leçon <b>'+L.pnum+'</b> chargée. Suis les étapes une par une — je reste en bas à droite si tu perds le fil.','norm'),700);
}

function updateLessonUI(){
  if(!curLesson)return;
  const L=curLesson;
  const ok=L.exos.filter((_,k)=>exoDone(L,k)).length;
  const bar=$('#lsBar'),pct=$('#lsPct'),st=$('#asKuboSt');
  if(bar)bar.style.width=ok/L.exos.length*100+'%';
  if(pct)pct.textContent=ok+' / '+L.exos.length+' RÉUSSIES';
  if(st)st.textContent=ok===L.exos.length?'prêt à valider la leçon':'attend tes missions ('+ok+'/'+L.exos.length+')';
  const box=$('#finishBox'),finBtn=$('#finBtn'),finT=$('#finT'),finS=$('#finS');
  if(!finBtn)return;
  if(lessonDone(L)){
    box.classList.add('finish-done');
    finT.textContent='Leçon déjà validée';finS.textContent='Tu peux refaire les missions librement — révision gratuite.';
    finBtn.innerHTML='<i data-lucide="check"></i>VALIDÉE';finBtn.disabled=true;
  }else if(ok===L.exos.length){
    box.classList.add('finish-done');
    finT.textContent='Toutes les missions sont réussies';finS.textContent='Il ne reste plus qu\u2019à valider officiellement cette leçon.';
    finBtn.disabled=false;finBtn.innerHTML='<i data-lucide="check"></i>TERMINER LA LEÇON · +100 XP';
  }else{
    box.classList.remove('finish-done');
    finT.textContent='Validation de la leçon';finS.textContent='Termine les '+L.exos.length+' missions pour débloquer la suite ('+ok+'/'+L.exos.length+' faites).';
    finBtn.disabled=true;finBtn.innerHTML='<i data-lucide="lock"></i>MISSIONS REQUISES';
  }
  refreshIcons();
}
function setupSpy(v){
  const links=[...v.querySelectorAll('#asPlan a')];
  const obs=new IntersectionObserver(es=>{
    es.forEach(e=>{if(e.isIntersecting)links.forEach(a=>a.classList.toggle('on',a.dataset.goto===e.target.id));});
  },{rootMargin:'-30% 0px -60% 0px'});
  v.querySelectorAll('.step, .exos-sec').forEach(s=>obs.observe(s));
}

/* ============================================================
   EXERCICES
   ============================================================ */
const TYPE_LABEL={mcq:'QCM',tf:'VRAI / FAUX',order:'ORDRE',fill:'CODE À TROUS'};
const LETTERS=['A','B','C','D','E'];

function renderExercise(L,ex,idx){
  const exId=L.id+'-e'+idx;
  const card=document.createElement('div');
  card.className='ex-card'+(exoDone(L,idx)?' ok':'');
  card.id='ex'+idx;
  card.innerHTML='<div class="ex-h"><span class="ex-num">MISSION '+(idx+1)+'</span><span class="ex-badge">'+TYPE_LABEL[ex.type]+'</span><span class="sp"></span>'
  +(exoDone(L,idx)?'<span class="ex-okmark"><i data-lucide="check"></i>RÉUSSIE · +50 XP</span><button class="ex-redo" title="Refaire la mission"><i data-lucide="rotate-ccw"></i>REFAIRE</button>':'')
  +'</div><div class="ex-b"></div>';
  const body=card.querySelector('.ex-b');
  const feed=document.createElement('div');feed.className='ex-feed';
  const bindRedo=c=>{const r=c.querySelector('.ex-redo');if(r)r.onclick=()=>{card.replaceWith(renderExercise(L,ex,idx));};};

  const success=()=>{
    const first=!state.ex[exId];
    if(first){
      state.ex[exId]=true;save();addXP(50);
      toast('Mission réussie — +50 XP','zap');
      const mis=app.querySelector('.as-mis li[data-goto="ex'+idx+'"]');if(mis)mis.classList.add('ok');
      updateLessonUI();
    }
    card.classList.add('ok','locked');
    card.querySelector('.ex-h .sp').insertAdjacentHTML('afterend',
      '<span class="ex-okmark"><i data-lucide="check"></i>RÉUSSIE'+(first?' · +50 XP':'')+'</span><button class="ex-redo" title="Refaire"><i data-lucide="rotate-ccw"></i>REFAIRE</button>');
    bindRedo(card);refreshIcons();
    if(first)kuboSpeak(SUCCESS_MSGS[Math.random()*SUCCESS_MSGS.length|0],'happy');
  };
  const failMsg=()=>kuboSpeak(ERROR_MSGS[Math.random()*ERROR_MSGS.length|0],'think');

  if(ex.type==='mcq'){
    body.innerHTML='<div class="ex-q">'+ex.q+'</div>';
    ex.opts.forEach((o,i)=>{
      const b=document.createElement('button');b.className='opt';
      b.innerHTML='<span class="ol">'+LETTERS[i]+'</span><span>'+o+'</span>';
      b.addEventListener('click',()=>{
        if(card.classList.contains('locked'))return;
        if(i===ex.a){
          b.classList.add('right');feed.className='ex-feed show good';
          feed.innerHTML='<b>Exact. </b>'+ex.why;body.appendChild(feed);success();
        }else{
          b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),500);
          feed.className='ex-feed show bad';feed.textContent='Pas tout à fait — observe bien et réessaie.';
          body.appendChild(feed);failMsg();
        }
      });
      body.appendChild(b);
    });
  }

  if(ex.type==='tf'){
    body.innerHTML='<div class="ex-q">'+ex.q+'</div>';
    const row=document.createElement('div');row.className='tf-row';
    [['VRAI',true],['FAUX',false]].forEach(([lab,val])=>{
      const b=document.createElement('button');b.className='tf';b.textContent=lab;
      b.addEventListener('click',()=>{
        if(card.classList.contains('locked'))return;
        if(val===ex.a){
          b.classList.add('right');feed.className='ex-feed show good';
          feed.innerHTML='<b>Exact. </b>'+ex.why;body.appendChild(feed);success();
        }else{
          b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),500);
          feed.className='ex-feed show bad';feed.textContent='Raté — réfléchis encore un instant.';
          body.appendChild(feed);failMsg();
        }
      });
      row.appendChild(b);
    });
    body.appendChild(row);
  }

  if(ex.type==='order'){
    body.innerHTML='<div class="ex-q">'+ex.q+'</div><div class="ord-lab">TA SÉQUENCE</div><div class="ord-seq"></div><div class="ord-lab">ÉTAPES DISPONIBLES</div><div class="ord-pool"></div>';
    const seq=body.querySelector('.ord-seq'),pool=body.querySelector('.ord-pool');
    let picked=[];
    const renderSeq=()=>{
      seq.innerHTML=picked.length?'':'<span class="hint">Clique les étapes ci-dessous dans le bon ordre…</span>';
      picked.forEach((txt,i)=>{
        const c=document.createElement('button');c.className='ord-chip';
        c.innerHTML='<span class="n">'+(i+1)+'</span>'+txt;
        c.addEventListener('click',()=>{if(card.classList.contains('locked'))return;picked.splice(i,1);renderSeq();renderPool();});
        seq.appendChild(c);
      });
    };
    const renderPool=()=>{
      pool.innerHTML='';
      shuffle(ex.items.filter(it=>!picked.includes(it))).forEach(txt=>{
        const c=document.createElement('button');c.className='ord-chip';c.textContent=txt;
        c.addEventListener('click',()=>{if(card.classList.contains('locked'))return;picked.push(txt);renderSeq();renderPool();});
        pool.appendChild(c);
      });
    };
    renderSeq();renderPool();
    const actions=document.createElement('div');actions.className='ex-actions';
    const chk=document.createElement('button');chk.className='ex-check';chk.innerHTML='<i data-lucide="check"></i>VÉRIFIER';
    chk.addEventListener('click',()=>{
      if(card.classList.contains('locked'))return;
      if(picked.length<ex.items.length){feed.className='ex-feed show bad';feed.textContent='Place les '+ex.items.length+' étapes avant de vérifier ('+picked.length+'/'+ex.items.length+').';body.appendChild(feed);return;}
      let good=0;
      seq.querySelectorAll('.ord-chip').forEach((c,i)=>{
        c.classList.remove('good','bad');
        if(picked[i]===ex.items[i]){good++;c.classList.add('good');}else c.classList.add('bad');
      });
      if(good===ex.items.length){
        feed.className='ex-feed show good';feed.innerHTML='<b>Séquence parfaite. </b>L\u2019ordre des étapes, c\u2019est la moitié du métier.';body.appendChild(feed);success();
      }else{
        feed.className='ex-feed show bad';feed.textContent=good+'/'+ex.items.length+' bien placées — les erreurs sont encadrées en rouge. Réessaie ou réinitialise.';
        body.appendChild(feed);failMsg();
      }
    });
    const rst=document.createElement('button');rst.className='ex-reset';rst.textContent='RÉINITIALISER';
    rst.addEventListener('click',()=>{picked=[];renderSeq();renderPool();feed.className='ex-feed';});
    actions.append(chk,rst);body.appendChild(actions);body.appendChild(feed);
  }

  if(ex.type==='fill'){
    const parts=ex.code.split(/‹([^‹›]*)›/);
    const correct=parts.filter((_,i)=>i%2===1);
    const tokens=shuffle([...correct,...(ex.extra||[])]);
    body.innerHTML='<div class="ex-q">'+ex.q+'</div><div class="fill-code"></div><div class="ord-lab" style="margin-top:15px">PIÈCES DISPONIBLES — CLIQUE POUR REMPLIR LE TROU SÉLECTIONNÉ</div><div class="tok-pool"></div>';
    const codeEl=body.querySelector('.fill-code'),pool=body.querySelector('.tok-pool');
    parts.forEach((p,i)=>{
      if(i%2===0){codeEl.appendChild(document.createTextNode(p));return;}
      const h=document.createElement('button');h.className='hole';h.innerHTML='&nbsp;';
      h.addEventListener('click',()=>{
        if(card.classList.contains('locked'))return;
        body.querySelectorAll('.hole').forEach(x=>x.classList.remove('sel'));
        if(h.classList.contains('filled')){
          const val=h.textContent;
          const tk=[...pool.children].find(t=>t.classList.contains('used')&&t.dataset.val===val);
          if(tk){tk.classList.remove('used');h.classList.remove('filled');h.innerHTML='&nbsp;';h.dataset.val='';}
        }else{
          h.classList.add('sel');
          const tk=[...pool.children].find(t=>!t.classList.contains('used'));
          if(tk)place(tk,h);
        }
      });
      codeEl.appendChild(h);
    });
    function place(tk,h){
      h.textContent=tk.dataset.val;h.dataset.val=tk.dataset.val;
      h.classList.add('filled');h.classList.remove('sel','bad','good');
      tk.classList.add('used');
      const nx=[...body.querySelectorAll('.hole')].find(x=>!x.classList.contains('filled'));
      body.querySelectorAll('.hole').forEach(x=>x.classList.remove('sel'));
      if(nx)nx.classList.add('sel');
    }
    tokens.forEach(val=>{
      const tk=document.createElement('button');tk.className='tokc';tk.textContent=val;tk.dataset.val=val;
      tk.addEventListener('click',()=>{
        if(card.classList.contains('locked')||tk.classList.contains('used'))return;
        const sel=body.querySelector('.hole.sel:not(.filled)')||body.querySelector('.hole:not(.filled)');
        if(sel)place(tk,sel);
      });
      pool.appendChild(tk);
    });
    const actions=document.createElement('div');actions.className='ex-actions';
    const chk=document.createElement('button');chk.className='ex-check';chk.innerHTML='<i data-lucide="check"></i>VÉRIFIER';
    chk.addEventListener('click',()=>{
      if(card.classList.contains('locked'))return;
      const holes=[...body.querySelectorAll('.hole')];
      if(holes.some(h=>!h.classList.contains('filled'))){
        feed.className='ex-feed show bad';feed.textContent='Il reste des trous vides — remplis-les tous.';
        body.appendChild(feed);return;
      }
      let good=0;
      holes.forEach((h,i)=>{
        h.classList.remove('bad','good');
        if(h.dataset.val===correct[i]){good++;h.classList.add('good');}else h.classList.add('bad');
      });
      if(good===correct.length){
        feed.className='ex-feed show good';feed.innerHTML='<b>Code exact. </b>Tu maîtrises la syntaxe.';body.appendChild(feed);success();
      }else{
        feed.className='ex-feed show bad';feed.textContent=good+'/'+correct.length+' trous corrects — les mauvais sont en rouge. Clique un trou rempli pour le vider.';
        body.appendChild(feed);failMsg();
      }
    });
    const rst=document.createElement('button');rst.className='ex-reset';rst.textContent='RÉINITIALISER';
    rst.addEventListener('click',()=>{
      body.querySelectorAll('.hole').forEach(h=>{h.classList.remove('filled','bad','good','sel');h.innerHTML='&nbsp;';h.dataset.val='';});
      pool.querySelectorAll('.tokc').forEach(t=>t.classList.remove('used'));
      feed.className='ex-feed';
    });
    actions.append(chk,rst);body.appendChild(actions);body.appendChild(feed);
  }

  bindRedo(card);
  refreshIcons();
  return card;
}

/* ============================================================
   NAVIGATION
   ============================================================ */
function openLesson(id){buildLesson(id);}
function goHome(){buildHome();setTimeout(()=>{const t=$('#pilier-build');if(t)t.scrollIntoView({behavior:'smooth',block:'start'});},350);}

document.addEventListener('click',e=>{
  try{
    const open=e.target.closest('[data-open]');
    if(open){openLesson(open.dataset.open);return;}
    if(e.target.closest('[data-home]')||e.target.closest('#homeLink')){goHome();return;}
    const sc=e.target.closest('[data-scroll]');
    if(sc){const t=document.getElementById(sc.dataset.scroll);if(t)t.scrollIntoView({behavior:'smooth'});return;}
    const go=e.target.closest('[data-goto]');
    if(go){const t=document.getElementById(go.dataset.goto);if(t)t.scrollIntoView({behavior:'smooth',block:'start'});return;}
    const cp=e.target.closest('.copy-btn');
    if(cp){const code=window._CODES&&window._CODES[cp.dataset.cid];if(code!=null)copyText(code);}
  }catch(err){console.error(err);}
});

async function copyText(t){
  try{await navigator.clipboard.writeText(t);}
  catch(e){
    const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(_){}ta.remove();
  }
  toast('Code copié dans le presse-papiers','copy');
}

 $('#kbAv').addEventListener('click',()=>{
  try{
    if(curLesson){
      const L=curLesson,left=L.exos.filter((_,i)=>!exoDone(L,i)).length;
      if(left)kuboSpeak('Il te reste <b>'+left+' mission'+(left>1?'s':'')+'</b> dans cette leçon. Objectif : tout cocher pour la valider !','think');
      else if(!lessonDone(L))kuboSpeak('Toutes les missions sont réussies — valide la leçon en bas de page !','happy');
      else kuboSpeak('Leçon déjà validée. On passe à la suivante ?','happy');
    }else{
      const nl=nextLesson();
      if(nl)kuboSpeak('Prochaine étape : <b>'+nl.pnum+' — '+nl.title+'</b> (pilier '+(nl.pillar==='build'?'BUILD':'CODE')+').','norm');
      else kuboSpeak('Cursus terminé ! Tu peux rejouer les missions ou repartir de zéro.','star');
    }
  }catch(e){console.error(e);}
});

 $('#resetBtn').addEventListener('click',()=>{$('#modal').classList.add('open');refreshIcons();});
 $('#moCancel').addEventListener('click',()=>$('#modal').classList.remove('open'));
 $('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').classList.remove('open');});
 $('#moConfirm').addEventListener('click',()=>{
  state={done:[],ex:{},xp:0};save();
  $('#modal').classList.remove('open');
  updateHeader();buildHome();
  toast('Progression réinitialisée','rotate-ccw');
  kuboSpeak('On repart de zéro… ensemble, comme au premier jour. Le pilier BUILD nous attend.','norm',6000);
});

function updateHeader(){
  const el=$('#hdXP');el.textContent=state.xp+' XP';
  $('#hdRank').textContent=rankOf(state.xp);
  LESSONS.filter(l=>l.pillar==='build').forEach((l,i)=>{
    const seg=$('#hdSegB').children[i];if(!seg)return;
    let p=0;if(lessonDone(l))p=100;else{const n=l.exos.filter((_,j)=>state.ex[l.id+'-e'+j]).length;p=n/l.exos.length*100;}
    seg.firstElementChild.style.width=p+'%';
  });
  LESSONS.filter(l=>l.pillar==='lua').forEach((l,i)=>{
    const seg=$('#hdSegC').children[i];if(!seg)return;
    let p=0;if(lessonDone(l))p=100;else{const n=l.exos.filter((_,j)=>state.ex[l.id+'-e'+j]).length;p=n/l.exos.length*100;}
    seg.firstElementChild.style.width=p+'%';
  });
}
(function(){
  const sb=$('#hdSegB'),sc=$('#hdSegC');
  LESSONS.filter(l=>l.pillar==='build').forEach(()=>{const d=document.createElement('div');d.className='seg';d.innerHTML='<i></i>';sb.appendChild(d);});
  LESSONS.filter(l=>l.pillar==='lua').forEach(()=>{const d=document.createElement('div');d.className='seg';d.innerHTML='<i></i>';sc.appendChild(d);});
})();

/* ============================================================
   INITIALISATION — protégée
   ============================================================ */
function killBoot(){
  const b=document.getElementById('boot');
  if(b){b.classList.add('done');setTimeout(()=>{if(b.parentNode)b.remove();},600);}
}
try{
  kuboAvatar();
  updateHeader();
  buildHome();
}catch(err){
  console.error('Erreur au démarrage :',err);
  killBoot();
  app.innerHTML='<div class="wrap" style="padding:60px 24px"><h1 style="font-weight:600;color:var(--ink)">Oups — un problème est survenu au chargement.</h1>'
  +'<p style="color:var(--muted);margin:14px 0">Recharge la page (F5). Si le problème persiste, ouvre la console du navigateur (F12) pour voir le détail de l\u2019erreur.</p>'
  +'<button class="btn btn-p" onclick="location.reload()"><i data-lucide="refresh-cw"></i>Recharger la page</button></div>';
  refreshIcons();
}
setTimeout(killBoot,3200);
</script>
